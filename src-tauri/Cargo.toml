[package]
name = "mc-feedback-viewer"
version = "0.1.3"
description = "A lightweight read-only NetEase Minecraft developer feedback viewer"
edition = "2024"
rust-version = "1.88"
publish = false

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
base64 = "0.22.1"
ecb = { version = "0.2.1", features = ["alloc"] }
hex = "0.4.3"
keyring = "4.1.6"
num-bigint = "0.4.6"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "query", "rustls", "system-proxy"] }
rpassword = "7.4.0"
rmcp = { version = "3.1.4", features = ["server", "transport-io", "schemars"] }
rsa = "0.9.8"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sm4 = "0.6.0"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
